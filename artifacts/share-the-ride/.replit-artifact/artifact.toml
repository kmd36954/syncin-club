kind = "web"
previewPath = "/"
title = "ShareTheRide"
version = "1.0.0"
id = "artifacts/share-the-ride"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24662
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/share-the-ride run dev"

[services.env]
PORT = "24662"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/share-the-ride", "run", "build"]
publicDir = "artifacts/share-the-ride/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
