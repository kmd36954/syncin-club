[phases.setup]
nixPkgs = ["nodejs", "curl"]

[phases.install]
cmds = [
  "curl -fsSL https://fnm.vercel.app/install | bash",
  "export PATH=\"$HOME/.fnm:$PATH\"",
  "fnm install 20",
  "fnm use 20",
  "corepack enable",
  "corepack prepare pnpm@8.15.0 --activate",
  "pnpm install"
]

[phases.build]
cmds = [
  "pnpm --filter share-the-ride build"
]

[start]
cmd = "pnpm --filter share-the-ride preview --host"
